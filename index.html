<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search your Fav Movies</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <meta name="description" content="Search and explore your favorite movies on Watch.This."> <!-- Added meta description for SEO -->
</head>
<body>
  <header>
    <div class="logo"><a href="index.html">watch.this</a></div>
    <div class="menu-container">
      <nav class="main-nav">
        <a href="index.html" class="nav-btn">Home</a>
        <a href="#" id="goHollywoodBtn" class="nav-btn active">Hollywood</a>
        <a href="#" id="goBollywoodBtn" class="nav-btn">Bollywood</a>
        <a href="watchlater.html" class="nav-btn">Watch Later</a>
      </nav>
      <div class="user-nav">
        <button class="search-toggle" aria-label="Toggle search">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
        <div class="search-container">
          <input type="text" class="search-box" id="searchBox" placeholder="Search..." oninput="fetchSuggestions(event)" onkeypress="performSearch(event)" onblur="hideSearch()" />
          <div class="suggestions" id="suggestions"></div>
        </div>
        <button class="user-badge" aria-label="User menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm-6 6v-2a6 6 0 0 1 12 0v2"></path>
          </svg>
        </button>
        <div class="user-menu" id="userMenu">
          <div id="greeting" class="greeting"></div>
          <button id="logout-btn" class="nav-btn">Logout</button> <!-- Styled as nav-btn -->
        </div>
      </div>
    </div>
    <button class="mobile-menu-toggle" aria-label="Toggle menu">
      <span class="hamburger"></span>
    </button>
  </header>
  <div id="currentlyWatchingContainer"></div>
  <main id="mainContent"></main>
  <script src="script.js" defer></script> <!-- Added defer attribute for better performance -->
  <script>
    // Firebase initialization moved to script.js, but adding auth state listener here
    let currentUser = null;
    firebase.auth().onAuthStateChanged(user => {
      currentUser = user;
      displayGreeting();
    });

    function displayGreeting() {
      const greetingElement = document.getElementById('greeting');
      if (!greetingElement) return;

      if (currentUser) {
        const username = currentUser?.email ? currentUser.email.split('@')[0] : 'Guest'; // Added fallback for undefined email
        greetingElement.innerHTML = `
          <div style="display: flex; flex-direction: column; align-items: flex-end;">
            <div style="font-size: 1.2rem; font-weight: bold;">Hi, ${username}</div>
            <button onclick="logout()" class="logout-btn">Logout</button>
            <a href="watchlater.html" style="color: white; text-decoration: none; font-size: 1rem; margin-top: 5px;">Watch Later</a>
          </div>
        `;
      } else {
        greetingElement.innerHTML = `
          <a href="login.html" class="nav-link">Log In</a> <!-- Moved inline styles to CSS -->
          <a href="watchlater.html" class="nav-link" style="margin-left: 20px;">Watch Later</a>
        `;
      }
    }

    function logout() {
      firebase.auth().signOut().then(() => {
        window.location.href = 'login.html';
      }).catch(error => {
        alert('An error occurred while logging out. Please try again. Error: ' + error.message); // Improved error message
      });
    }
  </script>
</body>
</html>
