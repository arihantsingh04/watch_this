<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch.This - Your Ultimate Movie & Series Destination</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <meta name="description" content="Discover and watch your favorite movies and TV series with Watch.This - the ultimate entertainment platform with stunning 3D glassmorphism design.">
  <meta name="keywords" content="movies, tv series, streaming, entertainment, watch online">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
  <header>
    <div class="logo">
      <a href="index.html">watch.this</a>
    </div>
    <div class="menu-container">
      <nav class="main-nav">
        <a href="index.html" class="nav-btn">🏠 Home</a>
        <a href="#" id="goHollywoodBtn" class="nav-btn active">🎬 Hollywood</a>
        <a href="#" id="goBollywoodBtn" class="nav-btn">🎭 Bollywood</a>
        <a href="watchlater.html" class="nav-btn">📚 Watch Later</a>
      </nav>
      <div class="user-nav">
        <button class="search-toggle" aria-label="Toggle search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
        <div class="search-container">
          <input 
            type="text" 
            class="search-box" 
            id="searchBox" 
            placeholder="Search movies & series..." 
            oninput="fetchSuggestions(event)" 
            onkeypress="performSearch(event)" 
            onblur="hideSearch()" 
          />
          <div class="suggestions" id="suggestions"></div>
        </div>
        <button class="user-badge" aria-label="User menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm-6 6v-2a6 6 0 0 1 12 0v2"></path>
          </svg>
        </button>
        <div class="user-menu" id="userMenu">
          <div id="greeting" class="greeting"></div>
          <button id="logout-btn" class="nav-btn">Logout</button>
        </div>
      </div>
    </div>
    <button class="mobile-menu-toggle" aria-label="Toggle menu">
      <span class="hamburger"></span>
    </button>
  </header>

  <div id="currentlyWatchingContainer"></div>
  
  <main id="mainContent">
    <!-- Content will be dynamically loaded here -->
  </main>

  <script src="script.js" defer></script>
  <script>
    // Firebase initialization and auth state management
    let currentUser = null;
    firebase.auth().onAuthStateChanged(user => {
      currentUser = user;
      displayGreeting();
    });

    function displayGreeting() {
      const greetingElement = document.getElementById('greeting');
      if (!greetingElement) return;

      if (currentUser) {
        const username = currentUser && currentUser.email ? currentUser.email.split('@')[0] : 'Guest';
        greetingElement.innerHTML = 
          '<div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">' +
            '<div style="font-size: 1.2rem; font-weight: 700; background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">' +
              'Hi, ' + username +
            '</div>' +
            '<button onclick="logout()" class="logout-btn">Logout</button>' +
            '<a href="watchlater.html" style="color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; padding: 5px 10px; background: var(--glass-bg); border-radius: 15px; border: 1px solid var(--glass-border); transition: var(--transition-smooth);">' +
              '📚 Watch Later' +
            '</a>' +
          '</div>';
      } else {
        greetingElement.innerHTML = 
          '<div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">' +
            '<a href="login.html" style="color: var(--text-primary); text-decoration: none; font-size: 1.1rem; font-weight: 600; padding: 10px 20px; background: var(--gradient-primary); border-radius: 25px; transition: var(--transition-bounce);" ' +
               'onmouseover="this.style.transform=\'scale(1.05)\'" ' +
               'onmouseout="this.style.transform=\'scale(1)\'">' +
              '🚀 Log In' +
            '</a>' +
            '<a href="watchlater.html" style="color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; padding: 5px 10px; background: var(--glass-bg); border-radius: 15px; border: 1px solid var(--glass-border);">' +
              '📚 Watch Later' +
            '</a>' +
          '</div>';
      }
    }

    function logout() {
      firebase.auth().signOut().then(() => {
        // Add smooth logout animation
        document.body.style.transition = 'opacity 0.3s ease';
        document.body.style.opacity = '0.5';
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 300);
      }).catch(error => {
        alert('An error occurred while logging out. Please try again. Error: ' + error.message);
      });
    }

    // Enhanced page interactions
    document.addEventListener('DOMContentLoaded', () => {
      // Add hover effects to navigation
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('mouseenter', () => {
          btn.style.transform = 'translateY(-2px)';
        });
        btn.addEventListener('mouseleave', () => {
          btn.style.transform = 'translateY(0)';
        });
      });

      // Add click ripple effect
      document.addEventListener('click', (e) => {
        if (e.target.matches('button, .nav-btn, .movie-card')) {
          const ripple = document.createElement('span');
          const rect = e.target.getBoundingClientRect();
          const size = Math.max(rect.width, rect.height);
          const x = e.clientX - rect.left - size / 2;
          const y = e.clientY - rect.top - size / 2;
          
          ripple.style.cssText = 
            'position: absolute;' +
            'width: ' + size + 'px;' +
            'height: ' + size + 'px;' +
            'left: ' + x + 'px;' +
            'top: ' + y + 'px;' +
            'background: rgba(255, 255, 255, 0.3);' +
            'border-radius: 50%;' +
            'transform: scale(0);' +
            'animation: ripple 0.6s ease-out;' +
            'pointer-events: none;' +
            'z-index: 1;';
          
          e.target.style.position = 'relative';
          e.target.style.overflow = 'hidden';
          e.target.appendChild(ripple);
          
          setTimeout(() => ripple.remove(), 600);
        }
      });

      // Add CSS for ripple animation
      const style = document.createElement('style');
      style.textContent = 
        '@keyframes ripple {' +
          'to {' +
            'transform: scale(2);' +
            'opacity: 0;' +
          '}' +
        '}';
      document.head.appendChild(style);
    });
  </script>
</body>
</html>
