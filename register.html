<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Style+Script&display=swap');

    * {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-image: url(./bg.jpg);
      background-size: cover;
      background-position: center;
      color: white;
    }

    .header-container {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 30px;
    }

    .logo {
      font-family: 'Style Script', cursive;
      font-size: 3rem;
      color: #007df3;
    }

    .divider {
      width: 2px;
      height: 50px;
      background-color: rgba(255, 255, 255, 0.7);
      margin: 0 20px;
    }

    .form-container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      text-align: center;
    }

    .form-group {
      position: relative;
      margin-bottom: 1.5rem;
    }

    .form-control {
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 5px;
      color: white;
      padding: .5rem 1rem 0.5rem;
    }

    .form-control:focus {
      background: rgba(255, 255, 255, 0.2);
      color: white;
    }

    .form-label {
      position: absolute;
      top: 7px;
      left: 15px;
      pointer-events: none;
      transition: all 0.3s ease-in-out;
      opacity: 0.6;
    }

    .form-control:focus + .form-label,
    .form-control:not(:placeholder-shown) + .form-label {
      transform: translateY(-30px);
      font-size: 0.75rem;
      opacity: 1;
    }

    .btn-primary {
      background-color: #007df3;
      border: none;
    }

    h2 {
      font-family: 'Style Script', cursive;
      font-size: 2.5rem;
      color: #ffffff;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <div class="form-container">
    <div class="header-container">
      <div class="logo">watch.this</div>
      <div class="divider"></div>
      <h2 class="text-center">Register</h2>
    </div>
    <form id="registerForm">
      <div class="form-group">
        <input type="text" class="form-control" id="name" placeholder=" " required>
        <label for="name" class="form-label">Name</label>
      </div>
      <div class="form-group">
        <input type="email" class="form-control" id="email" placeholder=" " required>
        <label for="email" class="form-label">Email</label>
      </div>
      <div class="form-group">
        <input type="password" class="form-control" id="password" placeholder=" " required>
        <label for="password" class="form-label">Password</label>
        <span 
          id="togglePassword" 
          style="position:absolute; right:15px; top:50%; transform:translateY(-50%); cursor:pointer; color:#ccc; font-size:1.2rem;"
          title="Show/Hide Password"
        style="position:absolute; right:15px; top:calc(50% - 2px); transform:translateY(-50%); cursor:pointer; color:#ccc; font-size:1.2rem;"
        title="Show/Hide Password"
        >
          <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
            <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zm-8 4a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm0-1.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/>
          </svg>
        </span>
        <script>
          // Show/hide password toggle
          document.addEventListener('DOMContentLoaded', function() {
            const passwordInput = document.getElementById('password');
            const togglePassword = document.getElementById('togglePassword');
            const eyeIcon = document.getElementById('eyeIcon');
            let show = false;

            togglePassword.addEventListener('click', function() {
              show = !show;
              passwordInput.type = show ? 'text' : 'password';
              eyeIcon.innerHTML = show 
          ? `<path d="M13.359 11.238l1.42 1.42a.75.75 0 1 1-1.06 1.06l-1.42-1.419A7.03 7.03 0 0 1 8 13.5c-5 0-8-5.5-8-5.5a15.6 15.6 0 0 1 3.14-3.668l-1.42-1.42a.75.75 0 1 1 1.06-1.06l1.42 1.419A7.03 7.03 0 0 1 8 2.5c5 0 8 5.5 8 5.5a15.6 15.6 0 0 1-3.14 3.668zM8 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/>`
          : `<path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zm-8 4a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm0-1.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/>`;
            });
          });
        </script>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Register</button>
    </form>
    <p class="text-center mt-3">Already have an account? <a href="login.html">Login</a></p>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

  <script>
    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBheoLlOSdjle4CCZpb1vLtg4R1OWyE5bQ",
      authDomain: "watch-this-f0b71.firebaseapp.com",
      projectId: "watch-this-f0b71",
      storageBucket: "watch-this-f0b71.firebasestorage.app",
      messagingSenderId: "1008946322583",
      appId: "1:1008946322583:web:dee56d71e612d35001ddd2",
      measurementId: "G-6TVXR7Y6QJ"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Register function
    document.getElementById('registerForm').addEventListener('submit', function(event) {
      event.preventDefault();
      
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      // Validate the email
      if (!email.includes('@') || !email.includes('.')) {
        alert("Please enter a valid email address.");
        return;
      }

      // Register the user with Firebase Authentication
      auth.createUserWithEmailAndPassword(email, password)
        .then((userCredential) => {
          const user = userCredential.user;

          // Update the user profile with name
          user.updateProfile({
            displayName: name
          });

          // Store additional user info in Firestore
          db.collection('users').doc(user.uid).set({
            name: name,
            email: email
          });

          alert('Registration successful!');
          window.location.href = 'login.html'; // Redirect to login page
        })
        .catch((error) => {
          alert('Error: ' + error.message);
        });
    });
  </script>
</body>
</html>
